# Darz Market Web — nginx, serving the built SPA.
#
# This is `vercel.json` rewritten for nginx. That file says:
#
#   "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
#
# and the `try_files` below is its exact equivalent. **It is not optional.**
# Without it, every route except `/` is a 404 the moment someone refreshes or
# opens a link directly — `/admin/accounting`, `/artwork/<id>`, all of them.
# The app would still work while you click around inside it, which is what
# makes this the classic SPA deployment bug: it looks fine until a reload.

server {
    # 8080 so the container can run unprivileged — see the Dockerfile.
    #
    # IPv4 only, deliberately. A `listen [::]:8080;` line beside this one is the
    # obvious thing to write and it is a **crash** on any host whose network
    # namespace has no IPv6: nginx refuses to start with
    # `socket() [::]:8080 failed (97: Address family not supported by protocol)`
    # — not a warning, the container just dies on boot. Found 2026-09-22 by
    # running this config for real; it had been written with the IPv6 line.
    # The official nginx image's own default config is IPv4-only for the same
    # reason. Nothing is lost: this port is always behind a proxy, a load
    # balancer or a CDN, and that is where a public IPv6 address terminates.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Vercel compresses by default; nginx does not. Without this the JS bundle
    # ships uncompressed, which is the difference between ~250 KB and ~900 KB
    # on a first load — and this app is served to people on mobile networks.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;
    # NOT font/woff2: woff2 is already Brotli-compressed internally, so gzip
    # costs CPU and adds bytes.

    # ---- Hashed build assets --------------------------------------------
    # Vite fingerprints everything under /assets (index-B_XofK8d.js, and the
    # self-hosted fonts). The name changes whenever the content does, so these
    # can be cached permanently — a stale one can never be served, because a
    # new build asks for a different filename.
    #
    # `try_files $uri =404` and NOT the SPA fallback: a missing asset must be a
    # 404. If it fell through to index.html, a stale client asking for a bundle
    # the current deploy has deleted would be handed an HTML page with a
    # `Content-Type: text/html`, and the console error would be a syntax error
    # in a JS file rather than the 404 it actually is. Verified: a made-up
    # `/assets/nope.js` returns 404 while `/admin/accounting` returns 200.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # THE SECURITY HEADERS ARE REPEATED HERE ON PURPOSE — see the note at
        # the bottom of this file. Deleting them does not fall back to the
        # server-level ones; it removes them from every asset response.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # ---- Everything else ------------------------------------------------
    location / {
        # A real file if there is one; otherwise hand the route to the app.
        try_files $uri $uri/ /index.html;
    }

    # ---- index.html is never cached -------------------------------------
    # It names the current hashed bundle. Cache it and a returning visitor
    # keeps loading yesterday's app — and, worse, keeps asking for a JS file
    # the new deploy has already deleted. This must come after the `location /`
    # above so it wins for the document itself.
    location = /index.html {
        # No `expires -1;` beside this: it emits its own `Cache-Control:
        # no-cache`, so the response carried the header TWICE. Harmless in a
        # browser, ambiguous to a CDN, and untidy. This one line says it all.
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Repeated for the same reason as above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ---- Headers ---------------------------------------------------------
    # These cover `location /` — the SPA routes. The two locations above repeat
    # them, and MUST.
    #
    # **nginx's `add_header` does not merge, it replaces.** A location block
    # that declares any `add_header` of its own discards *every* `add_header`
    # inherited from the enclosing block. Both locations above set
    # `Cache-Control`, so before this was fixed all three headers below were
    # silently absent from every single response — the asset responses, the
    # document, and every deep route, because `try_files` redirects those
    # internally into `location = /index.html`. The config looked completely
    # correct and shipped nothing. Found 2026-09-22 by running it and reading
    # the response headers; `nginx -t` is happy either way.
    #
    # So: if you add a fourth header, add it in THREE places. If you add a
    # fourth location with its own `add_header`, copy these into it.
    #
    # Deliberately NOT a Content-Security-Policy: this app talks to an API
    # origin that is a build-time value, so a CSP written here would either be
    # wrong for some builds or so loose it says nothing. Set it at the CDN or
    # reverse proxy, where the real origins are known.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    # SAMEORIGIN rather than DENY — the gallery portal is meant to be embeddable
    # by Darz's own pages.
    add_header X-Frame-Options       "SAMEORIGIN" always;

    # The favicon is the only root-level asset; keep it out of the access log.
    location = /favicon.svg { access_log off; expires 7d; }

    # No server version in response headers.
    server_tokens off;
}
