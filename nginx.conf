# Darz Market Web — nginx, serving the built SPA.
#
# This is `vercel.json` rewritten for nginx. That file says:
#
#   "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
#
# and the `try_files` below is its exact equivalent. **It is not optional.**
# Without it, every route except `/` is a 404 the moment someone refreshes or
# opens a link directly — `/admin/accounting`, `/artwork/<id>`, all of them.
# The app would still work while you click around inside it, which is what
# makes this the classic SPA deployment bug: it looks fine until a reload.

server {
    # 8080 so the container can run unprivileged — see the Dockerfile.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Vercel compresses by default; nginx does not. Without this the JS bundle
    # ships uncompressed, which is the difference between ~250 KB and ~900 KB
    # on a first load — and this app is served to people on mobile networks.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;
    # NOT font/woff2: woff2 is already Brotli-compressed internally, so gzip
    # costs CPU and adds bytes.

    # ---- Hashed build assets --------------------------------------------
    # Vite fingerprints everything under /assets (index-B_XofK8d.js, and the
    # self-hosted fonts). The name changes whenever the content does, so these
    # can be cached permanently — a stale one can never be served, because a
    # new build asks for a different filename.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Everything else ------------------------------------------------
    location / {
        # A real file if there is one; otherwise hand the route to the app.
        try_files $uri $uri/ /index.html;
    }

    # ---- index.html is never cached -------------------------------------
    # It names the current hashed bundle. Cache it and a returning visitor
    # keeps loading yesterday's app — and, worse, keeps asking for a JS file
    # the new deploy has already deleted. This must come after the `location /`
    # above so it wins for the document itself.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # ---- Headers ---------------------------------------------------------
    # Deliberately NOT a Content-Security-Policy: this app talks to an API
    # origin that is a build-time value, so a CSP written here would either be
    # wrong for some builds or so loose it says nothing. Set it at the CDN or
    # reverse proxy, where the real origins are known.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    # SAMEORIGIN rather than DENY — the gallery portal is meant to be embeddable
    # by Darz's own pages.
    add_header X-Frame-Options       "SAMEORIGIN" always;

    # The favicon is the only root-level asset; keep it out of the access log.
    location = /favicon.svg { access_log off; expires 7d; }

    # No server version in response headers.
    server_tokens off;
}
