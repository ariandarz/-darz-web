# The gate for this repo.
#
# Modelled on `darzstudio.art`'s own `Quality` workflow, reduced to the checks
# this project actually has: that repo additionally runs `perf:budget` (byte
# ceilings on its static HTML) and installs Chromium for its Playwright
# characterization suite. Neither applies here yet — there is no byte budget,
# and every test in `src/**/*.test.ts` is a pure logic test that needs no
# browser. The Phase 13 E2E stub tier landed as the `e2e` job below: it runs
# the smoke spec against `e2e/stub-server.mjs` (no backend service — the
# real-backend tier is local-only by design, see e2e/README.md).
#
# Until this existed, every "green" recorded in docs/TASKLIST.md was a
# contributor running these five commands by hand, and no pull request could
# fail. That is the whole point of the file.
name: Quality

on:
  pull_request:
  push:
    branches: [main]

# One run per commit, and one only.
#
# `push` used to list `development` as well, which ran the whole gate twice on
# every release: a release pull request has `development` as its head, so a
# push to `development` fired `push` *and* `pull_request` on the same commit,
# at the same time, for the same result. Dropping `development` costs no
# coverage — every commit gets there through a pull request, and GitHub runs
# `pull_request` against the *merge* commit (the head merged into the current
# base), so the gate already tested the merged tree. `main` keeps its `push`
# run: that one verifies what actually deploys, after the merge.
#
# `concurrency` handles the other waste. Pushing three commits to a branch
# started three full runs and let the two superseded ones finish; now a newer
# commit cancels the older run on the same pull request. Cancellation is
# limited to pull requests on purpose — a `push` run on `main` is the
# post-merge record of a deployed commit and should always finish, even when
# the next merge lands on top of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `@v5` throughout, not `@v4`. Every `v4` action runs on Node 20, which GitHub
# deprecated on 2025-09-19: the runner already forces them onto Node 24 and
# prints a warning on every job. Pinning the current majors is what stops that
# becoming a hard failure on a Tuesday.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 20 is the supported floor (this project runs on Node 20). The
          # component-test environment is pinned to `jsdom@29`, whose
          # `engines.node` is `^20.19.0 || ^22.13.0 || >=24.0.0` — the last
          # jsdom line that runs on Node 20. `jsdom@30` requires Node 22 (its
          # `undici` calls `webidl.util.markAsUncloneable`, a Node-22 API, and
          # on 20 the `.test.tsx` workers fail to spawn), so it is deliberately
          # held back. `engines` in package.json states the same floor.
          node-version: 20
          cache: npm

      - run: npm ci

      # Same five commands a contributor runs locally, in the same order, so a
      # green run here means exactly what a green run on a desk means.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test

      # `vite build` reads `.env.production`, which is committed and holds
      # deliberate `.invalid` placeholders (see the file's own header). No
      # secret is needed, and none should be added here: a real API URL belongs
      # to the deploy, not to the gate.
      - name: Production build
        run: npm run build

  # Phase 13 — the stub-tier smoke: boots the built app against the canned
  # stub API and walks gate → team sign-in → panel → a desk. Separate job so
  # the five-command gate above stays exactly what a contributor runs by hand.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 20 is the supported floor (this project runs on Node 20). The
          # component-test environment is pinned to `jsdom@29`, whose
          # `engines.node` is `^20.19.0 || ^22.13.0 || >=24.0.0` — the last
          # jsdom line that runs on Node 20. `jsdom@30` requires Node 22 (its
          # `undici` calls `webidl.util.markAsUncloneable`, a Node-22 API, and
          # on 20 the `.test.tsx` workers fail to spawn), so it is deliberately
          # held back. `engines` in package.json states the same floor.
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E smoke (stub tier)
        run: npm run e2e

      # a red e2e run must explain itself — Playwright's per-failure context
      # (error-context.md, traces) is unreadable otherwise
      - name: Upload failure context
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-failure-context
          path: test-results/
          if-no-files-found: ignore
